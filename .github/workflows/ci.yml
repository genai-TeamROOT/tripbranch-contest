name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: pytest
        run: pytest

  scoring-version:
    # 점수 로직이 바뀌었는데 SCORING_VERSION이 그대로면 PR 파일에 경고를 단다.
    #
    # **막지 않고 알리기만 한다.** 1.6.0 이후 scoring.py를 바꾼 4건 중 2건은
    # warnings 문자열만 더해 순위를 못 바꾸는 변경이었다 — 그런 PR까지 막으면
    # 우회하는 습관이 생긴다. 판단은 사람이 하고, 여기서는 놓치지 않게만 한다.
    # 판단 기준은 docs/scoring-version.md §2에 있다.
    name: Scoring version notice
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # 세 점 diff에 base 쪽 히스토리가 필요하다. 기본 shallow로는 안 된다.
          fetch-depth: 0

      - name: 점수 로직 변경에 버전이 따라왔는지 본다
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          file=backend/app/domain/scoring.py
          git fetch --no-tags origin "$BASE"
          if git diff --quiet "origin/$BASE...HEAD" -- "$file"; then
            echo "scoring.py 변경 없음 — 확인할 것 없음"
            exit 0
          fi
          if git diff "origin/$BASE...HEAD" -- "$file" | grep -qE '^[+-]SCORING_VERSION'; then
            echo "SCORING_VERSION이 함께 바뀌었음"
            exit 0
          fi
          line=$(grep -n 'SCORING_VERSION = ' "$file" | cut -d: -f1)
          echo "::warning file=$file,line=$line::점수 로직이 바뀌었는데 SCORING_VERSION은 그대로입니다. 순위가 바뀌지 않는 변경이면 그대로 두어도 됩니다 — 판단 기준은 docs/scoring-version.md 2절."

  prompt-sync:
    # 저장소의 프롬프트 Markdown과 Langfuse Prompt Management가 같은지 본다.
    #
    # **별도 job인 이유가 둘이다.** 하나는 실패 원인이 job 이름으로 바로 보이게 하려는
    # 것이다 — Langfuse가 죽어서 빨간 것과 프롬프트가 어긋나서 빨간 것은 대응이
    # 정반대인데, backend job에 섞으면 로그를 뒤져야 갈린다. 다른 하나는 이 job이
    # Langfuse 자격증명을 환경에 푸는데, pytest와 한 job에 있으면 그 값이 테스트
    # Provider 설정까지 건드릴 수 있어서다.
    #
    # **왜 필요한가**: 프롬프트를 고쳐도 Langfuse에 올리라고 알려주는 것이 아무것도
    # 없다. 커밋도 되고 CI도 통과하고 머지도 된다. 그래서 2026-09-03에 실제로
    # 어긋났다 — MODIFY 무장애 수정(#347)이 머지된 뒤 며칠이 아니라 몇 시간 만에,
    # `LANGFUSE_PROMPTS_ENABLED=true`인 환경이 수정 전 프롬프트로 돌고 있었다.
    # 오류도 경고도 나지 않아 사람이 우연히 `--check`를 돌려서야 발견했다.
    #
    # 조회 실패(Langfuse 장애)도 어긋남과 같이 실패로 친다 — "확인 못 했다"를
    # "괜찮다"로 치지 않는다(D-042와 같은 원칙). develop에 브랜치 보호가 없으므로
    # 이 job이 빨개도 기술적으로 머지가 막히지는 않는다. 장애로 판단되면 로그 첫
    # 줄("원격 목록 조회 실패")을 보고 사람이 정한다.
    name: Langfuse 프롬프트 대조
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 프롬프트 대조
        env:
          LANGFUSE_PROMPT_COMPARE: ${{ secrets.LANGFUSE_PROMPT_COMPARE }}
        run: |
          # 시크릿은 .env 형식 여러 줄이다. **저장소 안에 .env를 만들지 않는다** —
          # 만들면 같은 러너의 다른 단계가 그 파일을 읽어 Provider 설정이 바뀐다.
          printf '%s\n' "$LANGFUSE_PROMPT_COMPARE" > "$RUNNER_TEMP/langfuse.env"
          set -a
          . "$RUNNER_TEMP/langfuse.env"
          set +a
          # --diff: 실패했을 때 무엇이 다른지 로그에서 바로 본다. 없으면 "different"만
          # 뜨고 로컬에서 다시 돌려야 한다. 프롬프트 본문은 저장소에 이미 있는
          # 텍스트라 새로 노출되는 것이 없다.
          python -m scripts.sync_langfuse_prompts --diff


  frontend:
    name: Frontend (ESLint + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test -- --run

      - name: Build
        run: npm run build
