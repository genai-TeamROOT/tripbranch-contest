name: CI

on:
  pull_request:
  push:
    # develop도 넣는다. 작업 브랜치 -> develop -> main 흐름에서 검수는 develop에서
    # 하는데, PR 없이 develop에 직접 푸시하면 검사가 한 번도 안 돌고 main 승격
    # 후보가 된다. main은 승격 = 배포라 그때 처음 깨지는 것을 보면 늦다.
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: pytest
        run: pytest

  scoring-version:
    # 점수 로직이 바뀌었는데 SCORING_VERSION이 그대로면 PR 파일에 경고를 단다.
    #
    # **막지 않고 알리기만 한다.** 1.6.0 이후 scoring.py를 바꾼 4건 중 2건은
    # warnings 문자열만 더해 순위를 못 바꾸는 변경이었다 — 그런 PR까지 막으면
    # 우회하는 습관이 생긴다. 판단은 사람이 하고, 여기서는 놓치지 않게만 한다.
    # 판단 기준은 docs/scoring-version.md §2에 있다.
    name: Scoring version notice
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # 세 점 diff에 base 쪽 히스토리가 필요하다. 기본 shallow로는 안 된다.
          fetch-depth: 0

      - name: 점수 로직 변경에 버전이 따라왔는지 본다
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          file=backend/app/domain/scoring.py
          git fetch --no-tags origin "$BASE"
          if git diff --quiet "origin/$BASE...HEAD" -- "$file"; then
            echo "scoring.py 변경 없음 — 확인할 것 없음"
            exit 0
          fi
          if git diff "origin/$BASE...HEAD" -- "$file" | grep -qE '^[+-]SCORING_VERSION'; then
            echo "SCORING_VERSION이 함께 바뀌었음"
            exit 0
          fi
          line=$(grep -n 'SCORING_VERSION = ' "$file" | cut -d: -f1)
          echo "::warning file=$file,line=$line::점수 로직이 바뀌었는데 SCORING_VERSION은 그대로입니다. 순위가 바뀌지 않는 변경이면 그대로 두어도 됩니다 — 판단 기준은 docs/scoring-version.md 2절."

  # **Langfuse 프롬프트 대조 job은 이 저장소에서 걷어냈다**(2026-09-20).
  #
  # 본 저장소에는 남아 있다. 그쪽은 Langfuse Prompt Management 를 실제로 쓰므로
  # 저장소 Markdown 과 원격이 어긋나는 것을 잡아야 하지만, 공모전 제출본은
  # `LANGFUSE_PROMPTS_ENABLED=false` 로 두고 **저장소의 프롬프트만 쓴다**.
  # 대조할 원격이 없는데 job 만 남으니, 본 저장소에서 프롬프트를 고쳐 이쪽으로
  # 가져올 때마다 CI 가 빨개졌다.
  #
  # 끈 이유가 CI 소음만은 아니다. 두 저장소가 같은 Langfuse 프로젝트를 보고
  # 있어서, 원격 조회가 켜져 있으면 **본 저장소 팀이 프롬프트를 고치는 순간
  # 배포도 안 한 공모전 서버의 답변이 바뀐다.** 심사 기간에 그 경로를 열어 둘
  # 이유가 없다(docs/deploy.md "Langfuse" 절).
  #
  # 되살리려면 본 저장소의 ci.yml 에서 prompt-sync job 을 그대로 가져오면 된다.
  # 저장소 시크릿 LANGFUSE_PROMPT_COMPARE 는 지우지 않고 남겨 두었다.

  frontend:
    name: Frontend (ESLint + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test -- --run

      - name: Build
        run: npm run build
