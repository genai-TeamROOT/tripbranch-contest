name: Deploy frontend

on:
  push:
    # 작업 브랜치 -> develop -> 검수 -> main 순으로 올린다.
    # main은 승격된 것만 들어오는 브랜치이므로 승격 = 배포로 둔다.
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # 버킷 이름과 배포 ID는 저장소 변수에 둔다(Settings -> Secrets and variables ->
  # Actions -> Variables). docs/deploy.md에 채울 목록이 있다.
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check required variables
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # 변수를 안 채운 채 돌리면 빈 버킷 이름으로 sync를 시도해 알기 어려운
          # 오류가 난다. 여기서 이름을 찍어 멈춘다.
          #
          # Supabase 두 개도 여기서 막는다. 빠져도 빌드는 성공하는데,
          # `getSupabaseClient()`가 첫 호출에서 SupabaseConfigError를 던져
          # (frontend/src/auth/supabaseClient.ts) 로그인 경로가 통째로 죽는다.
          # 배포는 초록불인데 심사위원이 로그인을 못 하는 상황이 된다.
          missing=""
          if [ -z "$S3_BUCKET" ]; then missing="$missing S3_BUCKET"; fi
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then missing="$missing CLOUDFRONT_DISTRIBUTION_ID"; fi
          if [ -z "$VITE_API_BASE_URL" ]; then missing="$missing VITE_API_BASE_URL"; fi
          if [ -z "$VITE_SUPABASE_URL" ]; then missing="$missing VITE_SUPABASE_URL"; fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then missing="$missing VITE_SUPABASE_PUBLISHABLE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "저장소 변수가 비어 있습니다:$missing — docs/deploy.md를 참고하세요."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        # VITE_* 는 빌드 시점에 번들에 구워진다. 런타임에 바꿀 수 없으므로
        # 값이 바뀌면 프론트를 다시 배포해야 한다.
        #
        # 전부 Variables(Secrets 아님)에 둔다. 셋 다 브라우저로 내려가는 값이라
        # 애초에 비밀이 아니고, Secrets에 넣으면 빌드 산출물에서 마스킹돼 디버깅만
        # 어려워진다. 서버 전용 키(SUPABASE_SECRET_KEY 등)는 여기 오지 않는다 —
        # 그것들은 EC2의 /opt/tripbranch/.env에만 있다.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::577101745292:role/github-actions-deploy-contest
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # 해시가 붙은 정적 자산과 index.html을 나눠 올린다.
          #
          # Vite가 내는 assets/*.js는 내용이 바뀌면 파일명이 바뀌므로 영구 캐시해도
          # 안전하다. 반대로 index.html은 이름이 고정이라 캐시되면 새 배포가
          # 브라우저에 영영 안 닿는다 — 그래서 no-cache로 올린다.
          #
          # --delete는 지워진 파일을 버킷에서도 치운다. index.html을 제외했으므로
          # 이 단계에서 index.html이 지워지지 않는다(다음 단계가 덮어쓴다).
          aws s3 sync dist "s3://$S3_BUCKET" \
            --delete \
            --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          # index.html만 무효화하면 충분하다. 나머지는 파일명이 바뀌어 새로 받아간다.
          # CloudFront 무효화는 월 1,000경로까지 무료라 경로를 좁혀두면 비용이 0으로 남는다.
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/" \
            --query Invalidation.Id --output text)
          echo "invalidation: $ID"
